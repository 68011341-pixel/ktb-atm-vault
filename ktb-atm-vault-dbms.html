order_id",fk:{officer_id:"OFFICER_PROFILE",admin_id:"VAULT_ADMIN",atm_id:"ATM_TERMINAL",cassette_id:"VAULT_INVENTORY"},cols:["order_id","officer_id","admin_id","atm_id","cassette_id","cassette_qty","total_value_thb","dispatch_date","time_slot","status","short_month"]}},$f=`CREATE TABLE OFFICER_PROFILE (
  officer_id     INT           PRIMARY KEY,
  employee_code  VARCHAR(20)   NOT NULL UNIQUE,
  username       VARCHAR(30)   NOT NULL UNIQUE,
  password       VARCHAR(255)  NOT NULL,          -- bcrypt hash in production
  email          VARCHAR(120)  NOT NULL UNIQUE,
  firstname      VARCHAR(60)   NOT NULL,
  lastname       VARCHAR(60)   NOT NULL,
  assigned_zone  ENUM('Zone A','Zone B','Zone C') NOT NULL UNIQUE,  -- one account per zone
  created_at     DATETIME      NOT NULL DEFAULT CURRENT_TIMESTAMP
);

CREATE TABLE VAULT_ADMIN (
  admin_id    INT           PRIMARY KEY,
  admin_code  VARCHAR(20)   NOT NULL UNIQUE,
  username    VARCHAR(30)   NOT NULL UNIQUE,
  password    VARCHAR(255)  NOT NULL,             -- bcrypt hash in production
  email       VARCHAR(120)  NOT NULL UNIQUE,
  firstname   VARCHAR(60)   NOT NULL,
  lastname    VARCHAR(60)   NOT NULL,
  role_title  VARCHAR(80)   NOT NULL,
  created_at  DATETIME      NOT NULL DEFAULT CURRENT_TIMESTAMP
);

CREATE TABLE ATM_TERMINAL (
  atm_id                    INT            PRIMARY KEY,           -- 2001\u20262010
  terminal_code             VARCHAR(20)    NOT NULL UNIQUE,       -- KTB-KMITL-01\u202610
  location_name             NVARCHAR(160)  NOT NULL,
  zone                      ENUM('Zone A','Zone B','Zone C') NOT NULL,  -- CIT patrol zone
  zone_type                 ENUM('Bank Branch','Academic','Medical','Residential','Market','Commercial') NOT NULL,
  max_capacity_thb          DECIMAL(12,2)  NOT NULL,
  current_balance_thb       DECIMAL(12,2)  NOT NULL CHECK (current_balance_thb >= 0),
  safety_stock_thb          DECIMAL(12,2)  NOT NULL,              -- 0.2 \xD7 max_capacity_thb
  avg_daily_withdrawal_thb  DECIMAL(12,2)  NOT NULL,
  lead_time_days            DECIMAL(4,2)   NOT NULL DEFAULT 0.5,
  reorder_point_thb         DECIMAL(12,2)  NOT NULL,              -- avg_daily \xD7 lead_time + safety_stock
  status                    ENUM('CRITICAL','LOW WARNING','NORMAL') NOT NULL,
  latitude                  DECIMAL(10,7)  NOT NULL,
  longitude                 DECIMAL(10,7)  NOT NULL,
  CHECK (current_balance_thb <= max_capacity_thb)
);

CREATE TABLE VAULT_INVENTORY (
  cassette_id             INT            PRIMARY KEY,             -- 1001\u20261003
  cassette_code           VARCHAR(10)    NOT NULL UNIQUE,         -- CST-1000 / CST-500 / CST-100
  cassette_name           VARCHAR(60)    NOT NULL,
  denomination_thb        INT            NOT NULL,
  notes_per_cassette      INT            NOT NULL DEFAULT 2000,
  value_per_cassette_thb  DECIMAL(12,2)  NOT NULL,                -- denomination \xD7 notes
  vault_stock_units       INT            NOT NULL CHECK (vault_stock_units >= 0),
  min_vault_buffer_units  INT            NOT NULL
);

CREATE TABLE REPLENISHMENT_ORDER (
  order_id         INT            PRIMARY KEY,
  officer_id       INT            NOT NULL,       -- requester
  admin_id         INT            NULL,           -- approver (NULL while pending / cancelled)
  atm_id           INT            NOT NULL,
  cassette_id      INT            NOT NULL,
  cassette_qty     INT            NOT NULL CHECK (cassette_qty > 0),
  total_value_thb  DECIMAL(12,2)  NOT NULL,
  dispatch_date    DATE           NOT NULL,
  time_slot        ENUM('09:00-12:00','13:00-16:00') NOT NULL,
  status           ENUM('pending','approve','reject','cancel','completed') NOT NULL DEFAULT 'pending',
  short_month      CHAR(3)        NOT NULL,
  FOREIGN KEY (officer_id)  REFERENCES OFFICER_PROFILE(officer_id),
  FOREIGN KEY (admin_id)    REFERENCES VAULT_ADMIN(admin_id),
  FOREIGN KEY (atm_id)      REFERENCES ATM_TERMINAL(atm_id),
  FOREIGN KEY (cassette_id) REFERENCES VAULT_INVENTORY(cassette_id)
);

-- Excel-derived columns are a VIEW, not stored (keeps 3NF)
CREATE VIEW V_ATM_REPLENISHMENT AS
SELECT atm_id, terminal_code,
       current_balance_thb / max_capacity_thb AS balance_pct,
       CASE WHEN current_balance_thb <= reorder_point_thb
            THEN max_capacity_thb - current_balance_thb ELSE 0 END AS replenish_needed_thb
FROM ATM_TERMINAL;

-- ===================== ACCESS CONTROL =====================
-- Column-level: credentials are never readable across roles
CREATE VIEW V_OFFICER_DIRECTORY AS
  SELECT officer_id, employee_code, firstname, lastname, assigned_zone FROM OFFICER_PROFILE;
CREATE VIEW V_ADMIN_DIRECTORY AS
  SELECT admin_id, admin_code, firstname, lastname, role_title FROM VAULT_ADMIN;

-- Row-level: an officer only sees ATMs in their own zone
CREATE VIEW V_MY_ZONE_ATMS AS
  SELECT a.* FROM ATM_TERMINAL a
  JOIN OFFICER_PROFILE o ON a.zone = o.assigned_zone
  WHERE o.officer_id = @session_officer_id;

REVOKE ALL ON OFFICER_PROFILE FROM role_vault_admin;   -- admin cannot read/reset officer credentials
REVOKE ALL ON VAULT_ADMIN     FROM role_cit_officer;   -- officers cannot read admin credentials
GRANT SELECT ON V_OFFICER_DIRECTORY TO role_vault_admin;
GRANT SELECT ON V_ADMIN_DIRECTORY   TO role_cit_officer;

-- Self-service handover: each account updates ONLY its own row
UPDATE OFFICER_PROFILE SET firstname = ?, lastname = ?, username = ?, password = ?
 WHERE officer_id = @session_officer_id;
UPDATE VAULT_ADMIN SET firstname = ?, lastname = ?, username = ?, password = ?
